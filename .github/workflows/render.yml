name: Render video

on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Chrome dependencies + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 fonts-liberation

      - name: Check assets
        run: |
          missing=0
          for i in $(seq -w 1 31); do
            [ -f "public/scenes/$i.png" ] || { echo "::error::public/scenes/$i.png tidak ada"; missing=1; }
          done
          [ -f public/narasi.mp3 ] || echo "::warning::public/narasi.mp3 tidak ada (video tanpa audio)"
          [ -f public/subtitles.srt ] || echo "::warning::public/subtitles.srt tidak ada (subtitle cadangan dari scenesConfig)"
          exit $missing

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Render 1080x1920 @ 60 fps (H.264)
        run: |
          mkdir -p out
          npx remotion render MusikDiTengahTeror out/musik-di-tengah-teror.mp4 \
            --codec=h264 --crf=18 --pixel-format=yuv420p --image-format=jpeg --overwrite

      - name: Probe output
        continue-on-error: true
        run: npx remotion ffprobe out/musik-di-tengah-teror.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: musik-di-tengah-teror
          path: out/musik-di-tengah-teror.mp4
          retention-days: 14
          if-no-files-found: error
